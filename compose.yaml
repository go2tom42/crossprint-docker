services:
  crossprint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crossprint
    restart: unless-stopped
    ports:
      - "${CROSSPRINT_PORT:-5000}:5000"
    environment:
      PORT: "5000"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-600}"
      MAX_UNCOMPRESSED_MB: "${MAX_UNCOMPRESSED_MB:-3072}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Temporary uploads/results can spill to disk for large 3MF files.
    # Keep /tmp writable and ensure the Docker host has adequate free space.
